---
# This is an example playbook to execute Ansible tests.

- name: Check Vector
  hosts: all
  gather_facts: false
  tasks:
  - name: Check start service
    ansible.builtin.systemd:
      name: vector
      state: started
      enabled: true
    register: service_status
    check_mode: no

  - name: Assert service is running
    ansible.builtin.assert:
      that:
        - service_status.status.ActiveState == "active"
        - service_status.status.SubState == "running"
      fail_msg: "Vector service is not running"
      success_msg: "Vector service is running successfully"

  - name: Check vector validation
    ansible.builtin.command: vector validate --config /etc/vector/vector.toml
    register: vector_validate
    changed_when: false
    check_mode: no
      
  - name: Assert vector configuration is valid
    ansible.builtin.assert:
      that:
        - vector_validate.rc == 0
      fail_msg: "Vector configuration is invalid"
      success_msg: "Vector configuration is valid"