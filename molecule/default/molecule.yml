---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: centos8
    image: quay.io/centos/centos:stream8
    pre_build_image: true
  - name: oraclelinux:8
    image: quay.io/centos/oraclelinux:8
    pre_build_image: true
  - name: ubuntu:latest
    image: quay.io/centos/ubuntu:latest
    pre_build_image: true
provisioner:
  name: ansible
verifier:
  name: ansible
