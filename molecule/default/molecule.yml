---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: centos8
    image: quay.io/centos/centos:stream8
    pre_build_image: true
  - name: oraclelinux8
    image: docker.io/library/oraclelinux:8
    pre_build_image: true
  - name: ubuntu
    image: docker.io/library/ubuntu:latest
    pre_build_image: true
provisioner:
  name: ansible
verifier:
  name: ansible
